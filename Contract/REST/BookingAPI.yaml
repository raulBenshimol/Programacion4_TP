openapi: 3.0.3
info:
  title: Booking API - Consulta de estado de reserva
  version: 1.0.0
  description: >-
    Contrato propuesto para que Availability consulte en Booking el estado de
    una reserva. Las solicitudes llegan a Booking mediante MessageBroker; no se
    crean reservas por REST.
paths:
  /api/reservas/{reservaId}/estado:
    get:
      summary: Consultar estado de una reserva
      description: >-
        Devuelve el estado conocido por Booking para la reserva indicada.
        Si la reserva todavía no existe o no fue procesada, puede responder 404.
      operationId: obtenerEstado
      security:
        - bearerAuth: []
      parameters:
        - name: reservaId
          in: path
          required: true
          description: Identificador de la reserva generado por Booking.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reserva encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponseDto'
              example:
                id: 2cb2a78f-67dd-49c4-a4ac-ae1c3298b38c
                estado: Confirmada
                motivoRechazo: null
        '401':
          description: Token ausente o no válido.
        '403':
          description: La identidad autenticada no tiene permiso de consulta.
        '404':
          description: Reserva inexistente o todavía no procesada por Booking.
        '500':
          description: Error interno de Booking.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EstadoReserva:
      type: string
      enum:
        - Retenida
        - Confirmada
        - Rechazada
        - Vencida
    ReservaResponseDto:
      type: object
      additionalProperties: false
      required:
        - id
        - estado
      properties:
        id:
          type: string
          format: uuid
        estado:
          $ref: '#/components/schemas/EstadoReserva'
        motivoRechazo:
          type: string
          nullable: true
          description: Motivo cuando estado es Rechazada; en otros estados es nulo.