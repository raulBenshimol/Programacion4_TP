syntax = "proto3";

package reservas.payment.v1;

option csharp_namespace = "SistemaReservas.Contracts.Payment.V1";

// Contrato entre Booking (cliente) y Payment (servidor).
service PaymentService {
  // Cobra una reserva retenida.
  // - Pago aprobado o rechazado: respuesta normal (estado gRPC OK); ver PaymentResponseDto.exitoso.
  // - Errores gRPC solo para problemas técnicos o de pedido:
  //   INVALID_ARGUMENT: datos inválidos (UUID mal formado, monto menor o igual a cero).
  //   UNAUTHENTICATED: token ausente o inválido (token del AuthServer en la Metadata "Authorization: Bearer ...").
  // - Si Payment no responde a tiempo, Booking recibe UNAVAILABLE o DEADLINE_EXCEEDED
  //   y lo trata como "pago no disponible".
  // - Idempotencia: reserva_id identifica el cobro. Si llega un reserva_id ya procesado
  //   (por ejemplo, un reintento), Payment no vuelve a cobrar y devuelve el resultado original.
  rpc ProcesarPago (PaymentRequestDto) returns (PaymentResponseDto);
}

message PaymentRequestDto {
  // UUID de la solicitud generada por Availability (SolicitudReserva.solicitudId).
  // Se repite en los logs de auditoría de todos los servicios para seguir la cadena de sucesos.
  string solicitud_id = 1;

  // UUID de la reserva retenida creada por Booking.
  string reserva_id = 2;

  // Monto a cobrar en centavos (ejemplo: $1500,50 se envía como 150050).
  // Entero para no perder precisión: double no representa exactamente los decimales.
  int64 monto_centavos = 3;

  // Solo para pruebas del TP: si es true, Payment rechaza el pago.
  bool simular_rechazo = 4;
}

message PaymentResponseDto {
  // true: pago aprobado. false: pago rechazado (Booking rechaza la reserva por "pago fallido").
  bool exitoso = 1;

  // Descripción legible del resultado; si el pago se rechazó, indica el motivo.
  string mensaje = 2;

  // Identificador de la transacción generado por Payment. Vacío si el pago se rechazó.
  string codigo_transferencia = 3;
}